[project]
name = "powderbuoy"
version = "0.1.0"
description = "Does a Pacific Ocean buoy tell us anything useful about Utah snow?"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powderbuoy"]
